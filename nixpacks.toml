# Railway (and any other Nixpacks-based host) builds this app using its
# built-in PHP + Node providers for composer install. Nixpacks does NOT
# reliably run the front-end build step on its own for a combined PHP+Node
# project, so it's forced explicitly here - without this, the app deploys
# with no compiled CSS/JS at all (every page renders as unstyled HTML).
[phases.build]
cmds = ["npm ci", "npm run build"]

# Run pending migrations, start the scheduler in the background (so daily
# jobs like payment reminders and the database backup actually fire - a
# plain "php artisan serve" never triggers Laravel's scheduler on its own),
# then serve on the port Railway assigns via $PORT.
[start]
cmd = "php artisan migrate --force && (php artisan schedule:work >> storage/logs/schedule.log 2>&1 &) && php artisan serve --host=0.0.0.0 --port=$PORT"
