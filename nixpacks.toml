# Railway (and any other Nixpacks-based host) builds this app using its
# built-in PHP + Node providers for composer install. Nixpacks does NOT
# reliably run the front-end build step on its own for a combined PHP+Node
# project, so it's forced explicitly here - without this, the app deploys
# with no compiled CSS/JS at all (every page renders as unstyled HTML).
[phases.build]
cmds = ["npm ci", "npm run build"]

# Recreate the storage subfolders Laravel expects to exist at boot before
# doing anything else. If a Railway Volume is ever mounted at (or above)
# storage/, it replaces whatever was baked into the image there with
# whatever the volume actually has - on a brand new volume, that's
# nothing, which crashes the very first artisan command (OptimizeClear,
# called during migrate/storage:link) because storage/framework/{cache,
# sessions,views} and storage/logs don't exist to write to. mkdir -p is a
# no-op if they're already there, so this is safe whether or not a volume
# is attached, and makes the app resilient to one being added later
# without needing this start command touched again.
#
# Then run pending migrations, ensure the public/storage symlink exists
# (without it, every uploaded file - expense receipts, student ID/license
# documents, theory class materials - stores fine but 404s when linked to,
# since Storage::disk('public')->url() points through that symlink when
# AWS_BUCKET isn't set; storage:link is a no-op if it's already there, so
# this is safe on every restart), then serve on the port Railway assigns
# via $PORT.
#
# The scheduler (daily/weekly reminders, the database backup) does NOT run
# in this container. It previously tried to via a backgrounded
# "nohup php artisan schedule:work &" alongside this same "php artisan
# serve" process, but that silently stopped running in production more
# than once with nothing visibly erroring - a background child process in
# the same container is fragile (it can die to a restart, a health check,
# or a resource limit without the main process noticing). Scheduled jobs
# now run on a dedicated Railway Cron Job service instead, configured
# separately in the Railway dashboard with its own start command
# ("php artisan schedule:run") on a recurring cron trigger - see the
# Activity Log page's "Background Scheduler" status to confirm it's
# actually running.
#
# mkdir -p alone previously failed *silently* here: if a mounted volume
# owns storage/ with permissions the app user can't write to, mkdir exits
# non-zero but the ";" chain swallows that and carries on as if the
# folders existed, so the very next artisan command crashes with a
# confusing "View path not found" instead of a permissions error. The
# ls -la below prints exactly what's on disk (owner, mode, and whether
# the mkdir actually produced anything) right before the app would crash,
# so a real permissions problem is diagnosable from the deploy log
# instead of guessed at.
[start]
cmd = "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs storage/app/public; echo '--- storage/framework after mkdir ---'; ls -la storage storage/framework storage/framework/views storage/logs 2>&1; php artisan migrate --force || exit 1; php artisan storage:link || true; php artisan serve --host=0.0.0.0 --port=$PORT"
