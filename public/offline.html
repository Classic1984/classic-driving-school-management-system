<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - CDSMS</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background: #000; color: #fbbf24; border-radius: 0.75rem; padding: 2.5rem; max-width: 24rem; text-align: center; }
        .card img { height: 4rem; width: 4rem; margin: 0 auto 1rem; display: block; }
        h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
        p { color: #d1d5db; font-size: 0.875rem; margin: 0 0 1.5rem; }
        button { background: #f59e0b; color: #000; border: none; border-radius: 0.5rem; padding: 0.6rem 1.25rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/logo.png" alt="Classic Driving School">
        <h1>You're offline</h1>
        <p>CDSMS needs an internet connection to load student, payment, and attendance data. Check your connection and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
